[project]
name = "nyc-collision-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "pyarrow",
    "pandas",
    "pydeck",
    "streamlit",
    "reportlab",
    "openpyxl",
    "pydantic",
    "shapely",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
